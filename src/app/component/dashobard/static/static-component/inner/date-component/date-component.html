
<mat-card class="date-display-card">
  <mat-card-content class="date-content">
    <div class="date-main">{{ currentDate | date:'MMM dd' }}</div>
    <div class="date-year">{{ currentDate | date:'yyyy' }}</div>
    <div class="date-day">{{ currentDate | date:'EEEE' }}</div>
  </mat-card-content>
</mat-card>
