<div class="search-row">
  <div class="search">
    <form (ngSubmit)="loadAll()">
      <input type="search" placeholder="Search here" [(ngModel)]="searchText" name="search" (ngModelChange)="onSearchChange($event)">
    </form>
  </div>

  <div class="add-new" (click)="openDialog()">
    <i class="fa-solid fa-plus"></i>
    New Category
  </div>
</div>

<hr>

<!-- Loading Spinner -->
<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
  <span class="loading-text">Loading categories...</span>
</div>

<table *ngIf="!loading" mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="position">
    <th mat-header-cell *matHeaderCellDef> No. </th>
    <td mat-cell *matCellDef="let element"> {{element.position}} </td>
  </ng-container>

  <ng-container matColumnDef="categoryName">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.categoryName}} </td>
  </ng-container>

  <ng-container matColumnDef="activeStatus">
    <th mat-header-cell *matHeaderCellDef> Active </th>
    <td mat-cell *matCellDef="let element">
      <app-change-category-state [category]="element" (statusChanged)="changedStatus()"></app-change-category-state>
    </td>
  </ng-container>

  <ng-container matColumnDef="tools">
    <th mat-header-cell *matHeaderCellDef> Tools </th>
    <td mat-cell *matCellDef="let element">
      <div class="tools">
        <i class="fa-solid fa-pen update" matTooltip="Update Category" (click)="updateCategory(element)"></i>
        <i class="fa-solid fa-trash delete" matTooltip="Delete Category" (click)="deleteCategory(element)"></i>
      </div>
    </td>
  </ng-container>

  <!-- No data row -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayedColumns.length">
      <div class="no-data-container">
        <mat-icon class="no-data-icon">inbox</mat-icon>
        <span>No categories found</span>
      </div>
    </td>
  </tr>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator
  [pageSize]="size"
  [pageSizeOptions]="[5, 10, 25]"
  [pageIndex]="page"
  [length]="totalItems"
  (page)="onPageChange($event)"
  showFirstLastButtons
></mat-paginator>
