<h2 mat-dialog-title>Upload New Category</h2>
<form [formGroup]="form">
<mat-dialog-content class="mat-typography">

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Category Name</mat-label>
    <input matInput formControlName="categoryName" placeholder="Enter category name" />
  </mat-form-field>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancel</button>
  <button
    matButton="filled"
    class="submit-btn"
    [ngClass]="{ 'loading': loading }"
    (click)="uploadCategory()"
    [mat-dialog-close]="true"
    cdkFocusInitial
    [disabled]="form.invalid || loading">

    @if (loading) {
      <span><app-progress-spinner></app-progress-spinner></span>
    } @else {
      <span>Upload Category</span>
    }
  </button>

</mat-dialog-actions>
</form>
