<h2 mat-dialog-title>Update User</h2>
<form [formGroup]="form">
  <mat-dialog-content class="mat-typography">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Mobile Number</mat-label>
      <input matInput formControlName="mobileNumber" placeholder="XXXXX" />
    </mat-form-field>

<!--    <mat-form-field appearance="outline" class="code-input">-->
<!--      <mat-select formControlName="code">-->
<!--        <mat-option *ngFor="let code of countryCodes" [value]="code">-->
<!--          {{ code }}-->
<!--        </mat-option>-->
<!--      </mat-select>-->
<!--    </mat-form-field>-->

<!--    <mat-form-field appearance="outline" class="number-input">-->
<!--      <input matInput type="tel" formControlName="phone" placeholder="XXXXX" />-->
<!--    </mat-form-field>-->

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton mat-dialog-close>Cancel</button>
    <button
      matButton="filled"
      class="submit-btn"
      [ngClass]="{ 'loading': loading }"
      (click)="updateUser()"
      [mat-dialog-close]="false"
      [disabled]="isUpdateDisabled"
      cdkFocusInitial>

      @if (loading) {
        <span><app-progress-spinner></app-progress-spinner></span>
      } @else {
        <span>Update User</span>
      }
    </button>
  </mat-dialog-actions>
</form>
