<h2 mat-dialog-title>Update User</h2>
<form [formGroup]="form">
  <mat-dialog-content class="mat-typography">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Username / Name</mat-label>
      <input matInput formControlName="username" placeholder="Enter name or username" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Mobile Number</mat-label>
      <input matInput formControlName="mobileNumber" placeholder="XXXXX" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>User Role</mat-label>
      <mat-select formControlName="role">
        <mat-option *ngFor="let roleOpt of availableRoles" [value]="roleOpt.value">
          {{ roleOpt.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton mat-dialog-close>Cancel</button>
    <button
      type="button"
      matButton="filled"
      class="submit-btn"
      [ngClass]="{ 'loading': loading }"
      (click)="updateUser()"
      [disabled]="isUpdateDisabled"
      cdkFocusInitial>

      @if (loading) {
        <span><app-progress-spinner></app-progress-spinner></span>
      } @else {
        <span>Update User</span>
      }
    </button>
  </mat-dialog-actions>
</form>
