<h2 mat-dialog-title class="dialog-title">Change User Password</h2>

<mat-dialog-content class="dialog-content">
  <div class="user-info-box mb-3">
    <p><strong>Name / Username:</strong> {{ data.username || 'N/A' }}</p>
    <p><strong>Mobile Number:</strong> {{ data.mobileNumber }}</p>
  </div>

  <div class="form-group mb-3">
    <label for="newPassword" class="form-label font-bold text-gray-700">New Password:</label>
    <div class="password-input-wrapper">
      <input
        id="newPassword"
        [type]="hidePassword ? 'password' : 'text'"
        class="form-control"
        [(ngModel)]="newPassword"
        placeholder="Enter new password (min. 6 characters)"
        (keyup.enter)="onChangePassword()"
      />
      <button
        type="button"
        class="toggle-pwd-btn"
        (click)="hidePassword = !hidePassword"
        tabindex="-1"
        [title]="hidePassword ? 'Show password' : 'Hide password'"
      >
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </div>
    <small class="text-muted">Must be at least 6 characters long.</small>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="p-3">
  <button type="button" class="btn btn-secondary me-2" (click)="onCancel()" [disabled]="loading">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="onChangePassword()" [disabled]="loading">
    <span *ngIf="loading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
    Update Password
  </button>
</mat-dialog-actions>
