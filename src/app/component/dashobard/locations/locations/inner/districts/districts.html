
<div class="districts-container">
  <!-- Header with Add Button -->
  <div class="col-12">
    <div class="button-bar">
      <button matButton="filled" color="primary" (click)="openAddDistrictDialog()">
        + New District
      </button>
    </div>
  </div>

  <!-- Search Section -->
  <div class="search">
    <form>
      <input type="search"
             placeholder="search here"
             [formControl]="searchControl">
    </form>
    <hr>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading districts...</p>
  </div>

  <!-- Districts Table -->
  <div class="table-container" *ngIf="!loading">
    <table mat-table [dataSource]="dataSource" class="districts-table mat-elevation-z2">

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>District Name</th>
        <td mat-cell *matCellDef="let district">
          <span class="district-name">{{ district.name }}</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
        <td mat-cell *matCellDef="let district" class="actions-column">
          <div class="tools">
          <i class="fa-solid fa-pen update" matTooltip="Update User"   (click)="editDistrict(district)" ></i>
          <i class="fa-solid fa-trash delete" matTooltip="Delete User"   (click)="deleteDistrict(district)" > </i>
          </div>

        </td>
      </ng-container>

      <!-- Table Header and Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="setCities(row)" class="district-row"></tr>

    </table>

    <!-- No Data Message -->
    <div *ngIf="dataSource.length === 0" class="no-data">
      <mat-icon>location_off</mat-icon>
      <h3>No Districts Found</h3>
      <p *ngIf="searchText">No districts match your search criteria.</p>
      <p *ngIf="!searchText">No districts have been created yet.</p>
      <button mat-raised-button color="primary" (click)="openAddDistrictDialog()">
        <mat-icon>add</mat-icon>
        Add First District
      </button>
    </div>
  </div>

  <!-- Pagination -->
  <mat-paginator
    *ngIf="!loading && totalElements > 0"
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageChange($event)"
    showFirstLastButtons
    aria-label="Select page">
  </mat-paginator>

</div>
