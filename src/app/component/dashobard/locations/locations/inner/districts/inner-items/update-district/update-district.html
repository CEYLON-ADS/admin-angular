<h2 mat-dialog-title>Update District</h2>
<form [formGroup]="districtForm" (ngSubmit)="onSubmit()" class="district-form">
  <mat-dialog-content class="mat-typography">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>District Name</mat-label>
      <input matInput formControlName="name" required placeholder="Enter district name...">
      <mat-error *ngIf="nameControl.invalid && nameControl.touched">
        <span *ngIf="nameControl.hasError('required')">District name is required</span>
        <span *ngIf="nameControl.hasError('minlength')">District name must be at least 2 characters</span>
        <span *ngIf="nameControl.hasError('maxlength')">District name cannot exceed 100 characters</span>
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()" [disabled]="loading">
      Cancel
    </button>
    <button mat-button color="primary" type="submit"
            [disabled]="districtForm.invalid || loading || isUnchanged()">
      <mat-icon *ngIf="loading">hourglass_empty</mat-icon>
      <span *ngIf="!loading">Update District</span>
      <span *ngIf="loading">Updating...</span>
    </button>
  </mat-dialog-actions>
</form>
