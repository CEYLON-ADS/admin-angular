<div class="search-row">
  <div class="search">
    <form (ngSubmit)="loadAll()">
      <input type="search" placeholder="Search.." [(ngModel)]="searchText" name="search" (ngModelChange)="onSearchChange($event)">
    </form>
  </div>
</div>

<hr>

<!-- Loading Spinner -->
<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
  <span class="loading-text">Loading pending advertisements...</span>
</div>

<table *ngIf="!loading" mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="position">
    <th mat-header-cell *matHeaderCellDef> No. </th>
    <td mat-cell *matCellDef="let element"> {{element.position}} </td>
  </ng-container>

  <ng-container matColumnDef="userContact">
    <th mat-header-cell *matHeaderCellDef> User Mobile Number </th>
    <td mat-cell *matCellDef="let element"> {{element.userMobileNumber}} </td>
  </ng-container>

  <ng-container matColumnDef="categoryName">
    <th mat-header-cell *matHeaderCellDef> Category Name </th>
    <td mat-cell *matCellDef="let element"> {{element.categoryName}} </td>
  </ng-container>

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef> Ad Title </th>
    <td mat-cell *matCellDef="let element"> {{element.title | truncate:20 }} </td>
  </ng-container>

  <ng-container matColumnDef="activeState">
    <th mat-header-cell *matHeaderCellDef> Active </th>
    <td mat-cell *matCellDef="let element">
      {{ element.activeStatus ? 'Active' : 'Inactive' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="tools">
    <th mat-header-cell *matHeaderCellDef> Tools </th>
    <td mat-cell *matCellDef="let element">
      <div class="tools">
        <i class="fa-solid fa-eye view" matTooltip="View Advertisement" (click)="openViewDialog(element)"></i>
        <i class="fa-solid fa-trash delete" matTooltip="Delete Advertisement" (click)="deleteSlot(element)"></i>
      </div>
    </td>
  </ng-container>

  <!-- No data row -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayedColumns.length">
      <div class="no-data-container">
        <mat-icon class="no-data-icon">inbox</mat-icon>
        <span>No pending advertisements found</span>
      </div>
    </td>
  </tr>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator
  [pageSize]="size"
  [pageSizeOptions]="[5, 10, 25]"
  [pageIndex]="page"
  [length]="totalItems"
  (page)="onPageChange($event)"
  showFirstLastButtons
></mat-paginator>
